name: Native file dialog release smoke

on:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      RUSTUP_TOOLCHAIN: 1.99.0
      CARGO_HOME: /root/.cargo
      RUSTUP_HOME: /root/.rustup
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare disposable Linux portal environment
        run: |
          set -euo pipefail
          export PATH="/usr/libexec:$PATH"
          mkdir -p release-native-dialog-evidence-linux
          exec > >(tee release-native-dialog-evidence-linux/prerequisite.log) 2>&1
          if [ ! -f /.dockerenv ] || [ "$(id -u)" -ne 0 ]; then
            echo 'Native dialog setup requires a disposable root-owned container'
            exit 1
          fi
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl build-essential clang cmake ninja-build pkg-config libssl-dev \
            libasound2-dev libclang-dev libglib2.0-dev libgtk-3-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libfontconfig1-dev libfreetype6-dev libwayland-dev \
            libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxrandr-dev libxi-dev libxcursor-dev \
            libegl1-mesa-dev libgl1-mesa-dev libgl1-mesa-dri mesa-vulkan-drivers \
            xvfb xauth xdotool imagemagick dbus-x11 xdg-desktop-portal \
            xdg-desktop-portal-gtk openbox
          if ! command -v cargo >/dev/null 2>&1 || ! command -v rustc >/dev/null 2>&1; then
            curl --fail --location --silent --show-error \
              https://static.rust-lang.org/rustup/dist/x86_64-unknown-linux-gnu/rustup-init \
              --output /tmp/rustup-init
            chmod +x /tmp/rustup-init
            /tmp/rustup-init --default-toolchain 1.99.0 --profile minimal -y --no-modify-path
          fi
          export PATH="$CARGO_HOME/bin:$PATH"
          test "$(rustc --version | awk '{print $2}')" = '1.99.0'
          command -v xvfb-run dbus-run-session xdg-desktop-portal xdg-desktop-portal-gtk xdotool import openbox
      - name: Checkout pinned sibling repositories
        env:
          GITEA_TOKEN: ${{ secrets.RELEASE_READ_TOKEN }}
        run: |
          set -o pipefail
          python3 -c 'import sys; print(sys.version); assert sys.version_info >= (3, 11), "Python 3.11+ required"'
          python3 scripts/release/checkout_sources.py 2>&1 | tee checkout-sources.log
      - name: Exercise real native portal dialogs
        run: |
          set -euo pipefail
          export PATH="$CARGO_HOME/bin:$PATH"
          export PATH="/usr/libexec:$PATH"
          export XDG_CURRENT_DESKTOP=GNOME
          export XDG_SESSION_TYPE=x11
          xvfb-run -a -s '-screen 0 2560x1600x24' \
            dbus-run-session -- bash -c '
              openbox >release-native-dialog-evidence-linux/openbox.log 2>&1 &
              xdg-desktop-portal-gtk >release-native-dialog-evidence-linux/portal-gtk.log 2>&1 &
              xdg-desktop-portal >release-native-dialog-evidence-linux/portal.log 2>&1 &
              bash scripts/release/native_dialog_check.sh
            '
      - name: Upload native dialog evidence
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: release-native-dialog-linux
          path: |
            checkout-sources.log
            release-native-dialog-evidence-linux/
          if-no-files-found: warn
