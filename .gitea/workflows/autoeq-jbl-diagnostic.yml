name: JBL M2 PEQ feasibility diagnostic

on:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: 1.99.0
      CARGO_HOME: /root/.cargo
      RUSTUP_HOME: /root/.rustup
      CI: 'true'
      SOTF_GITEA_DISPOSABLE_RUNNER: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare disposable audio-device-free container
        run: |
          set -euo pipefail
          test -f /.dockerenv
          test "$(id -u)" -eq 0
          test ! -e /dev/snd
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl build-essential clang mold cmake ninja-build pkg-config \
            libssl-dev libasound2-dev libjack-jackd2-dev libclang-dev \
            libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libfontconfig1-dev \
            libfreetype6-dev libwayland-dev libx11-xcb-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxrandr-dev libxi-dev \
            libxcursor-dev libegl1-mesa-dev libgl1-mesa-dev libgl1-mesa-dri
          if ! command -v cargo >/dev/null 2>&1; then
            curl --fail --location --silent --show-error \
              https://static.rust-lang.org/rustup/dist/x86_64-unknown-linux-gnu/rustup-init \
              --output /tmp/rustup-init
            chmod +x /tmp/rustup-init
            /tmp/rustup-init --default-toolchain 1.99.0 --profile minimal -y --no-modify-path
          fi
          export PATH="$CARGO_HOME/bin:$PATH"
          test "$(rustc --version | awk '{print $2}')" = 1.99.0
          python3 -c 'import sys; assert sys.version_info >= (3, 11)'
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
      - name: Checkout pinned sources
        env:
          GITEA_TOKEN: ${{ secrets.RELEASE_READ_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/release/checkout_sources.py 2>&1 | tee checkout-sources.log
      - name: Require pinned toolchain and private QA state
        run: |
          set -euo pipefail
          test "$(rustc --version | awk '{print $2}')" = 1.99.0
          python3 -c 'import sys; assert sys.version_info >= (3, 11)'
          ORIGINAL_CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}"
          ORIGINAL_RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}"
          case "$ORIGINAL_CARGO_HOME" in /*) ;; *) exit 1 ;; esac
          case "$ORIGINAL_RUSTUP_HOME" in /*) ;; *) exit 1 ;; esac
          QA_HOME="$PWD/target/release-gitea/autoeq-jbl-private-home"
          mkdir -p "$QA_HOME/.cargo" "$QA_HOME/config" "$QA_HOME/cache" "$QA_HOME/runtime"
          chmod 700 "$QA_HOME" "$QA_HOME/runtime"
          {
            echo "HOME=$QA_HOME"
            echo "XDG_CONFIG_HOME=$QA_HOME/config"
            echo "XDG_CACHE_HOME=$QA_HOME/cache"
            echo "XDG_RUNTIME_DIR=$QA_HOME/runtime"
            echo "CARGO_HOME=$ORIGINAL_CARGO_HOME"
            echo "RUSTUP_HOME=$ORIGINAL_RUSTUP_HOME"
          } >> "$GITHUB_ENV"
      - name: Supervision preflight
        run: |
          set -euo pipefail
          python3 -m unittest scripts.release.test_nih_native_artifact_check scripts.release.test_autoeq_jbl_diagnostic -v 2>&1 | tee autoeq-jbl-diagnostic-preflight.log
          grep -Eq '^Ran 11 tests' autoeq-jbl-diagnostic-preflight.log
          grep -Eq '^OK$' autoeq-jbl-diagnostic-preflight.log
          ! grep -Eq 'skipped|FAIL|ERROR' autoeq-jbl-diagnostic-preflight.log
          grep -q 'test_stop_before_launch_does_not_spawn' autoeq-jbl-diagnostic-preflight.log
          grep -q 'test_exact_red_candidate_and_budget' autoeq-jbl-diagnostic-preflight.log
          grep -q 'test_missing_or_duplicate_vector_row_rejected' autoeq-jbl-diagnostic-preflight.log
          grep -q 'test_nonfinite_or_nonpositive_ceiling_rejected' autoeq-jbl-diagnostic-preflight.log
          grep -q 'test_budget_and_original_refusal_cannot_be_waived' autoeq-jbl-diagnostic-preflight.log
          grep -q 'test_sigterm_after_both_ready_markers_stops_group_and_next_launch' autoeq-jbl-diagnostic-preflight.log
      - name: Capture strict JBL M2 candidate refusal
        run: python3 scripts/release/autoeq_jbl_diagnostic.py
      - name: Retain Linux evidence
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: autoeq-jbl-diagnostic-linux
          path: |
            checkout-sources.log
            autoeq-jbl-diagnostic-preflight.log
            target/release-gitea/autoeq-jbl-diagnostic/
          if-no-files-found: error
