name: Probe bounded macOS Rust compilation

on:
  workflow_dispatch:

jobs:
  macos:
    runs-on: m4
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require Python 3.11 or newer
        run: python3 -c 'import sys; print(sys.version); assert sys.version_info >= (3, 11)'
      - name: Checkout pinned sibling repositories
        env:
          GITEA_TOKEN: ${{ secrets.RELEASE_READ_TOKEN }}
        run: |
          set -o pipefail
          python3 scripts/release/checkout_sources.py 2>&1 | tee checkout-sources.log
      - name: Run one bounded all-targets Rust compile
        run: python3 scripts/release/macos_compile_probe.py release-macos-compile-probe
      - name: Upload scoped runner and compilation evidence
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: macos-compile-probe
          if-no-files-found: warn
          path: |
            checkout-sources.log
            release-macos-compile-probe/
