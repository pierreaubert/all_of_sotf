name: NIH default and native Convolution tests

on:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    env:
      CI: 'true'
      SOTF_GITEA_DISPOSABLE_RUNNER: '1'
      RUSTUP_TOOLCHAIN: 1.99.0
      CARGO_HOME: /root/.cargo
      RUSTUP_HOME: /root/.rustup
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare disposable Linux Rust environment
        run: |
          set -euo pipefail
          test -f /.dockerenv
          test "$(id -u)" -eq 0
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl build-essential clang mold cmake ninja-build pkg-config \
            libssl-dev libasound2-dev libclang-dev libglib2.0-dev libgtk-3-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libfontconfig1-dev libfreetype6-dev libwayland-dev \
            libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxrandr-dev libxi-dev libxcursor-dev
          if ! command -v cargo >/dev/null 2>&1 || ! command -v rustc >/dev/null 2>&1; then
            curl --fail --location --silent --show-error \
              https://static.rust-lang.org/rustup/dist/x86_64-unknown-linux-gnu/rustup-init \
              --output /tmp/rustup-init
            chmod +x /tmp/rustup-init
            /tmp/rustup-init --default-toolchain 1.99.0 --profile minimal -y --no-modify-path
          fi
          export PATH="$CARGO_HOME/bin:$PATH"
          test "$(rustc --version | awk '{print $2}')" = 1.99.0
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
      - name: Require Python 3.11 or newer
        run: python3 -c 'import sys; assert sys.version_info >= (3, 11)'
      - name: Preflight NIH runner inventory and signal cleanup
        run: |
          set -o pipefail
          python3 -m unittest scripts.release.test_nih_default_native_check -v 2>&1 | tee nih-preflight.log
          grep -Eq '^Ran 7 tests in ' nih-preflight.log
          grep -Eq '^OK$' nih-preflight.log
          grep -Fq 'test_real_interrupt_stops_ready_parent_and_descendant' nih-preflight.log
          grep -Fq 'test_ignored_and_count_mismatch_are_rejected' nih-preflight.log
          grep -Fq 'test_only_manual_aud135_capture_ignore_is_accepted_with_real_controls' nih-preflight.log
          grep -Fq 'test_convolution_native_filters_require_one_exact_positive_without_ignores' nih-preflight.log
      - name: Checkout pinned sibling repositories
        env:
          GITEA_TOKEN: ${{ secrets.RELEASE_READ_TOKEN }}
        run: |
          set -o pipefail
          python3 scripts/release/checkout_sources.py 2>&1 | tee checkout-sources.log
      - name: Run default and Convolution native test inventories
        run: python3 scripts/release/nih_default_native_check.py target/release-gitea/nih-default-native-linux
      - name: Upload complete NIH evidence
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: nih-default-native-linux
          path: |
            checkout-sources.log
            nih-preflight.log
            target/release-gitea/nih-default-native-linux/
          if-no-files-found: error

  macos:
    runs-on: m4
    env:
      CI: 'true'
      SOTF_GITEA_DISPOSABLE_RUNNER: '1'
      RUSTUP_TOOLCHAIN: 1.99.0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require pinned toolchain and Python
        run: |
          set -euo pipefail
          test "$(rustc --version | awk '{print $2}')" = 1.99.0
          python3 -c 'import sys; assert sys.version_info >= (3, 11)'
      - name: Preflight NIH runner inventory and signal cleanup
        run: |
          set -o pipefail
          python3 -m unittest scripts.release.test_nih_default_native_check -v 2>&1 | tee nih-preflight.log
          grep -Eq '^Ran 7 tests in ' nih-preflight.log
          grep -Eq '^OK$' nih-preflight.log
          grep -Fq 'test_real_interrupt_stops_ready_parent_and_descendant' nih-preflight.log
          grep -Fq 'test_ignored_and_count_mismatch_are_rejected' nih-preflight.log
          grep -Fq 'test_only_manual_aud135_capture_ignore_is_accepted_with_real_controls' nih-preflight.log
          grep -Fq 'test_convolution_native_filters_require_one_exact_positive_without_ignores' nih-preflight.log
      - name: Checkout pinned sibling repositories
        env:
          GITEA_TOKEN: ${{ secrets.RELEASE_READ_TOKEN }}
        run: |
          set -o pipefail
          python3 scripts/release/checkout_sources.py 2>&1 | tee checkout-sources.log
      - name: Run default and Convolution native test inventories
        run: python3 scripts/release/nih_default_native_check.py target/release-gitea/nih-default-native-macos
      - name: Upload complete NIH evidence
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: nih-default-native-macos
          path: |
            checkout-sources.log
            nih-preflight.log
            target/release-gitea/nih-default-native-macos/
          if-no-files-found: error
