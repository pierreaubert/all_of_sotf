name: Fontconfig Parser compatibility fork standalone check
on:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      DISPOSABLE: "1"
      RUSTUP_TOOLCHAIN: "1.99.0"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare disposable compiler and prerequisites
        run: |
          set -euo pipefail
          test -f /.dockerenv
          test "$(id -u)" -eq 0
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git ca-certificates curl python3 build-essential pkg-config libfontconfig1-dev libfreetype-dev
          if ! command -v rustup >/dev/null 2>&1; then
            curl --fail --location --silent --show-error \
              https://static.rust-lang.org/rustup/dist/x86_64-unknown-linux-gnu/rustup-init \
              --output /tmp/rustup-init
            chmod +x /tmp/rustup-init
            /tmp/rustup-init --default-toolchain 1.99.0 --profile minimal -y --no-modify-path
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install 1.99.0 --profile minimal
          test "$(rustc +1.99.0 --version | awk '{print $2}')" = 1.99.0
      - name: Checkout exact nine sibling revisions
        env:
          GITEA_TOKEN: ${{ secrets.RELEASE_READ_TOKEN }}
        run: python3 scripts/release/checkout_sources.py
      - name: Prove reviewed Linux owned-process supervisor
        run: |
          set -euo pipefail
          mkdir -p target/release-gitea/fontconfig-parser-standalone
          python3 -m unittest -v scripts.release.test_nih_native_artifact_check 2>&1 | tee target/release-gitea/fontconfig-parser-standalone/supervisor-preflight.log
          grep -Eq '^Ran 7 tests in ' target/release-gitea/fontconfig-parser-standalone/supervisor-preflight.log
          grep -Fxq 'OK' target/release-gitea/fontconfig-parser-standalone/supervisor-preflight.log
          ! grep -Eq 'skipped=|expected failures=' target/release-gitea/fontconfig-parser-standalone/supervisor-preflight.log
      - name: Clone immutable Fontconfig Parser fork
        run: |
          set -euo pipefail
          mkdir -p target/release-gitea/fontconfig-parser-standalone
          git clone https://github.com/pierreaubert/fontconfig-parser.git target/release-gitea/fontconfig-parser-standalone/fontconfig-source
          git -C target/release-gitea/fontconfig-parser-standalone/fontconfig-source checkout --detach d247c91f5a57edd6ba6eb26e884d4904dbfbc87e
      - name: Compile and run original all-feature parser fixtures
        run: python3 scripts/release/fontconfig_parser_standalone_check.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: fontconfig-parser-standalone-linux
          path: target/release-gitea/fontconfig-parser-standalone/
          if-no-files-found: error

  macos:
    runs-on: m4
    env:
      CI: "true"
      DISPOSABLE: "1"
      RUSTUP_TOOLCHAIN: "1.99.0"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require pinned toolchain and Python
        run: |
          set -euo pipefail
          test "$(rustc --version | awk '{print $2}')" = 1.99.0
          python3 -c 'import sys; assert sys.version_info >= (3, 11)'
      - name: Checkout exact nine sibling revisions
        env:
          GITEA_TOKEN: ${{ secrets.RELEASE_READ_TOKEN }}
        run: python3 scripts/release/checkout_sources.py
      - name: Prove reviewed macOS owned-process supervisor
        run: |
          set -euo pipefail
          mkdir -p target/release-gitea/fontconfig-parser-standalone
          python3 -m unittest -v scripts.release.test_nih_macos_artifact_check 2>&1 | tee target/release-gitea/fontconfig-parser-standalone/supervisor-preflight.log
          grep -Eq '^Ran 7 tests in ' target/release-gitea/fontconfig-parser-standalone/supervisor-preflight.log
          grep -Fxq 'OK' target/release-gitea/fontconfig-parser-standalone/supervisor-preflight.log
          ! grep -Eq 'skipped=|expected failures=' target/release-gitea/fontconfig-parser-standalone/supervisor-preflight.log
      - name: Clone immutable Fontconfig Parser fork
        run: |
          set -euo pipefail
          mkdir -p target/release-gitea/fontconfig-parser-standalone
          git clone https://github.com/pierreaubert/fontconfig-parser.git target/release-gitea/fontconfig-parser-standalone/fontconfig-source
          git -C target/release-gitea/fontconfig-parser-standalone/fontconfig-source checkout --detach d247c91f5a57edd6ba6eb26e884d4904dbfbc87e
      - name: Compile and run original all-feature parser fixtures
        run: python3 scripts/release/fontconfig_parser_standalone_check.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: fontconfig-parser-standalone-macos
          path: target/release-gitea/fontconfig-parser-standalone/
          if-no-files-found: error
