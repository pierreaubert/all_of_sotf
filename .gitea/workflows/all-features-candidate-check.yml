name: Guarded all-feature candidate compilation

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Runner platform
        type: choice
        options: [all, macos, linux]
        default: all

jobs:
  linux:
    if: inputs.platform == 'all' || inputs.platform == 'linux'
    runs-on: x86:linux:host
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout immutable sibling sources
        env:
          GITEA_TOKEN: ${{ secrets.RELEASE_READ_TOKEN }}
        run: |
          set -o pipefail
          python3 scripts/release/checkout_sources.py 2>&1 | tee checkout-sources.log
      - name: Compile all ten locked workspaces with all features and targets
        run: |
          set -euo pipefail
          python3 -m unittest scripts.release.test_all_features_supervision -v 2>&1 | tee all-features-supervision.log
          grep -Eq '^Ran 2 tests in ' all-features-supervision.log
          grep -Eq '^OK$' all-features-supervision.log
          ! grep -Eiq 'skipped|expected failure|unexpected success' all-features-supervision.log
          python3 scripts/release/all_features_candidate_check.py target/release-gitea/all-features-candidate
      - name: Upload complete Linux evidence
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: all-features-candidate-linux
          path: |
            checkout-sources.log
            all-features-supervision.log
            target/release-gitea/all-features-candidate/
          if-no-files-found: warn

  macos:
    if: inputs.platform == 'all' || inputs.platform == 'macos'
    runs-on: m4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout immutable sibling sources
        env:
          GITEA_TOKEN: ${{ secrets.RELEASE_READ_TOKEN }}
        run: |
          set -o pipefail
          python3 scripts/release/checkout_sources.py 2>&1 | tee checkout-sources.log
      - name: Compile all ten locked workspaces with all features and targets
        run: |
          set -euo pipefail
          python3 -m unittest scripts.release.test_all_features_supervision -v 2>&1 | tee all-features-supervision.log
          grep -Eq '^Ran 2 tests in ' all-features-supervision.log
          grep -Eq '^OK$' all-features-supervision.log
          ! grep -Eiq 'skipped|expected failure|unexpected success' all-features-supervision.log
          python3 scripts/release/all_features_candidate_check.py target/release-gitea/all-features-candidate
      - name: Upload complete macOS evidence
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: all-features-candidate-macos
          path: |
            checkout-sources.log
            all-features-supervision.log
            target/release-gitea/all-features-candidate/
          if-no-files-found: warn
