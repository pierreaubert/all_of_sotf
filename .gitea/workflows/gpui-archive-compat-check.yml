name: GPUI archive runtime compatibility

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Runner platform
        type: choice
        options: [all, macos, linux]
        default: all

jobs:
  macos:
    if: inputs.platform == 'all' || inputs.platform == 'macos'
    runs-on: m4
    env:
      CI: 'true'
      SOTF_GITEA_DISPOSABLE_RUNNER: '1'
      RUSTUP_TOOLCHAIN: '1.99.0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require Python 3.11 or newer
        run: python3 -c 'import sys; assert sys.version_info >= (3, 11)'
      - name: Require pinned Rust 1.99.0
        run: test "$(rustc --version | awk '{print $2}')" = '1.99.0'
      - name: Checkout pinned siblings
        env:
          GITEA_TOKEN: ${{ secrets.RELEASE_READ_TOKEN }}
        run: |
          set -o pipefail
          mkdir -p target/release-gitea/gpui-archive-macos
          python3 scripts/release/checkout_sources.py 2>&1 | tee target/release-gitea/gpui-archive-macos/checkout.log
      - name: Runner preflight fixtures
        run: |
          set -o pipefail
          python3 -m unittest scripts.release.test_gpui_archive_check -v 2>&1 |
            tee target/release-gitea/gpui-archive-macos/preflight.log
          grep -q 'Ran 5 tests' target/release-gitea/gpui-archive-macos/preflight.log
          grep -q '^OK$' target/release-gitea/gpui-archive-macos/preflight.log
      - name: Five archive tests and all-target compilation
        env:
          GITEA_TOKEN: ${{ secrets.RELEASE_READ_TOKEN }}
        run: python3 scripts/release/gpui_archive_check.py target/release-gitea/gpui-archive-macos macos
      - name: Upload archive evidence
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: gpui-archive-macos
          path: target/release-gitea/gpui-archive-macos/
          if-no-files-found: error

  linux:
    if: inputs.platform == 'all' || inputs.platform == 'linux'
    runs-on: ubuntu-latest
    env:
      CI: 'true'
      SOTF_GITEA_DISPOSABLE_RUNNER: '1'
      RUSTUP_TOOLCHAIN: '1.99.0'
      CARGO_HOME: /root/.cargo
      RUSTUP_HOME: /root/.rustup
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require disposable Linux build prerequisites
        run: |
          set -euo pipefail
          mkdir -p target/release-gitea/gpui-archive-linux
          exec > >(tee target/release-gitea/gpui-archive-linux/prerequisites.log) 2>&1
          if [ ! -f /.dockerenv ] || [ "$(id -u)" -ne 0 ]; then
            echo 'Refusing package changes outside the disposable root-owned Gitea container'
            exit 1
          fi
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl build-essential clang mold cmake ninja-build pkg-config \
            libssl-dev libasound2-dev libclang-dev libglib2.0-dev libgtk-3-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libfontconfig1-dev libfreetype6-dev libwayland-dev libx11-xcb-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxrandr-dev libxi-dev libxcursor-dev \
            libegl1-mesa-dev libgl1-mesa-dev
          if ! command -v cargo >/dev/null 2>&1 || ! command -v rustc >/dev/null 2>&1; then
            curl --fail --location --silent --show-error \
              https://static.rust-lang.org/rustup/dist/x86_64-unknown-linux-gnu/rustup-init \
              --output /tmp/rustup-init
            chmod +x /tmp/rustup-init
            /tmp/rustup-init --default-toolchain 1.99.0 --profile minimal -y --no-modify-path
          fi
          export PATH="$CARGO_HOME/bin:$PATH"
          if command -v rustup >/dev/null 2>&1 && \
             ! rustup toolchain list | grep -Eq '^1\.99\.0-x86_64-unknown-linux-gnu'; then
            rustup toolchain install 1.99.0 --profile minimal
          fi
          test "$(rustc --version | awk '{print $2}')" = '1.99.0'
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
      - name: Require Python 3.11 or newer
        run: python3 -c 'import sys; assert sys.version_info >= (3, 11)'
      - name: Checkout pinned siblings
        env:
          GITEA_TOKEN: ${{ secrets.RELEASE_READ_TOKEN }}
        run: |
          set -o pipefail
          python3 scripts/release/checkout_sources.py 2>&1 | tee target/release-gitea/gpui-archive-linux/checkout.log
      - name: Runner preflight fixtures
        run: |
          set -o pipefail
          python3 -m unittest scripts.release.test_gpui_archive_check -v 2>&1 |
            tee target/release-gitea/gpui-archive-linux/preflight.log
          grep -q 'Ran 5 tests' target/release-gitea/gpui-archive-linux/preflight.log
          grep -q '^OK$' target/release-gitea/gpui-archive-linux/preflight.log
      - name: Five archive tests and all-target compilation
        env:
          GITEA_TOKEN: ${{ secrets.RELEASE_READ_TOKEN }}
        run: python3 scripts/release/gpui_archive_check.py target/release-gitea/gpui-archive-linux linux
      - name: Upload archive evidence
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: gpui-archive-linux
          path: target/release-gitea/gpui-archive-linux/
          if-no-files-found: error
