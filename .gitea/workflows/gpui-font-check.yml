name: GPUI pinned font and WGPU paint qualification

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Runner platform
        type: choice
        options: [all, macos, linux]
        default: all

jobs:
  macos:
    if: inputs.platform == 'all' || inputs.platform == 'macos'
    runs-on: m4
    env:
      CI: 'true'
      SOTF_GITEA_DISPOSABLE_RUNNER: '1'
      RUSTUP_TOOLCHAIN: '1.99.0'
      PYTHONOPTIMIZE: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require Python 3.11 or newer
        run: python3 -c 'import sys; assert sys.version_info >= (3, 11)'
      - name: Require pinned Rust 1.99.0
        run: test "$(rustc --version | awk '{print $2}')" = '1.99.0'
      - name: Use private HOME with original Rust tool homes
        run: |
          set -euo pipefail
          original_cargo_home="$(python3 -c 'import os, pathlib; print(pathlib.Path(os.environ.get("CARGO_HOME") or pathlib.Path.home() / ".cargo").resolve(strict=True))')"
          original_rustup_home="$(python3 -c 'import os, pathlib; print(pathlib.Path(os.environ.get("RUSTUP_HOME") or pathlib.Path.home() / ".rustup").resolve(strict=True))')"
          mkdir -p target/release-gitea/gpui-font-private-home/.cargo
          echo "HOME=$PWD/target/release-gitea/gpui-font-private-home" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$original_cargo_home" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$original_rustup_home" >> "$GITHUB_ENV"
      - name: Checkout pinned siblings
        env:
          GITEA_TOKEN: ${{ secrets.RELEASE_READ_TOKEN }}
        run: |
          set -o pipefail
          mkdir -p target/release-gitea/gpui-font-macos
          python3 scripts/release/checkout_sources.py 2>&1 | tee target/release-gitea/gpui-font-macos/checkout.log
      - name: Runner preflight fixtures
        run: |
          set -o pipefail
          python3 -m unittest scripts.release.test_gpui_font_check -v 2>&1 |
            tee target/release-gitea/gpui-font-macos/preflight.log
          grep -q 'Ran 7 tests' target/release-gitea/gpui-font-macos/preflight.log
          grep -q '^OK$' target/release-gitea/gpui-font-macos/preflight.log
          ! grep -Eiq 'skipped|expected failure|unexpected success' target/release-gitea/gpui-font-macos/preflight.log
      - name: Font shaping, SVG fallback, WGPU paint, and all-target compilation
        env:
          GITEA_TOKEN: ${{ secrets.RELEASE_READ_TOKEN }}
        run: python3 scripts/release/gpui_font_check.py target/release-gitea/gpui-font-macos macos
      - name: Upload font and paint evidence
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: gpui-font-macos
          path: target/release-gitea/gpui-font-macos/
          if-no-files-found: error

  linux:
    if: inputs.platform == 'all' || inputs.platform == 'linux'
    runs-on: ubuntu-latest
    env:
      CI: 'true'
      SOTF_GITEA_DISPOSABLE_RUNNER: '1'
      RUSTUP_TOOLCHAIN: '1.99.0'
      PYTHONOPTIMIZE: '0'
      PYTHONDONTWRITEBYTECODE: '1'
      CARGO_HOME: /root/.cargo
      RUSTUP_HOME: /root/.rustup
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require disposable Linux build prerequisites
        run: |
          set -euo pipefail
          mkdir -p target/release-gitea/gpui-font-linux
          exec > >(tee target/release-gitea/gpui-font-linux/prerequisites.log) 2>&1
          if [ ! -f /.dockerenv ] || [ "$(id -u)" -ne 0 ]; then
            echo 'Refusing package changes outside the disposable root-owned Gitea container'
            exit 1
          fi
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl build-essential clang mold cmake ninja-build pkg-config \
            libssl-dev libasound2-dev libclang-dev libglib2.0-dev libgtk-3-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libfontconfig1-dev libfreetype6-dev fonts-noto-core fonts-noto-cjk fonts-noto-color-emoji libwayland-dev libx11-xcb-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxrandr-dev libxi-dev libxcursor-dev \
            libegl1-mesa-dev libgl1-mesa-dev libgl1-mesa-dri libvulkan1 mesa-vulkan-drivers vulkan-tools
          lavapipe_icd=$(find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -print -quit)
          if [ -z "$lavapipe_icd" ]; then
            echo 'Lavapipe software Vulkan ICD is required for WGPU paint evidence'
            exit 1
          fi
          echo "VK_ICD_FILENAMES=$lavapipe_icd" >> "$GITHUB_ENV"
          VK_ICD_FILENAMES="$lavapipe_icd" vulkaninfo --summary
          if ! command -v cargo >/dev/null 2>&1 || ! command -v rustc >/dev/null 2>&1; then
            curl --fail --location --silent --show-error \
              https://static.rust-lang.org/rustup/dist/x86_64-unknown-linux-gnu/rustup-init \
              --output /tmp/rustup-init
            chmod +x /tmp/rustup-init
            /tmp/rustup-init --default-toolchain 1.99.0 --profile minimal -y --no-modify-path
          fi
          export PATH="$CARGO_HOME/bin:$PATH"
          if command -v rustup >/dev/null 2>&1 && \
             ! rustup toolchain list | grep -Eq '^1\.99\.0-x86_64-unknown-linux-gnu'; then
            rustup toolchain install 1.99.0 --profile minimal
          fi
          test "$(rustc --version | awk '{print $2}')" = '1.99.0'
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
      - name: Require Python 3.11 or newer
        run: python3 -c 'import sys; assert sys.version_info >= (3, 11)'
      - name: Use private HOME with original Rust tool homes
        run: |
          set -euo pipefail
          original_cargo_home="$(python3 -c 'import os, pathlib; print(pathlib.Path(os.environ.get("CARGO_HOME") or pathlib.Path.home() / ".cargo").resolve(strict=True))')"
          original_rustup_home="$(python3 -c 'import os, pathlib; print(pathlib.Path(os.environ.get("RUSTUP_HOME") or pathlib.Path.home() / ".rustup").resolve(strict=True))')"
          mkdir -p target/release-gitea/gpui-font-private-home/.cargo
          echo "HOME=$PWD/target/release-gitea/gpui-font-private-home" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$original_cargo_home" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$original_rustup_home" >> "$GITHUB_ENV"
      - name: Checkout pinned siblings
        env:
          GITEA_TOKEN: ${{ secrets.RELEASE_READ_TOKEN }}
        run: |
          set -o pipefail
          python3 scripts/release/checkout_sources.py 2>&1 | tee target/release-gitea/gpui-font-linux/checkout.log
      - name: Runner preflight fixtures
        run: |
          set -o pipefail
          python3 -m unittest scripts.release.test_gpui_font_check -v 2>&1 |
            tee target/release-gitea/gpui-font-linux/preflight.log
          grep -q 'Ran 7 tests' target/release-gitea/gpui-font-linux/preflight.log
          grep -q '^OK$' target/release-gitea/gpui-font-linux/preflight.log
          ! grep -Eiq 'skipped|expected failure|unexpected success' target/release-gitea/gpui-font-linux/preflight.log
      - name: Font shaping, SVG fallback, WGPU paint, and all-target compilation
        env:
          GITEA_TOKEN: ${{ secrets.RELEASE_READ_TOKEN }}
        run: python3 scripts/release/gpui_font_check.py target/release-gitea/gpui-font-linux linux
      - name: Upload font and paint evidence
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: gpui-font-linux
          path: target/release-gitea/gpui-font-linux/
          if-no-files-found: error
