name: Isolated systemwide lab QA

on:
  workflow_dispatch:

jobs:
  macos:
    runs-on: m4
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require Python 3.11 or newer
        run: python3 -c 'import sys; print(sys.version); assert sys.version_info >= (3, 11), "Python 3.11+ required"'
      - name: Checkout pinned sibling repositories
        env:
          GITEA_TOKEN: ${{ secrets.RELEASE_READ_TOKEN }}
        run: |
          set -o pipefail
          python3 scripts/release/checkout_sources.py 2>&1 | tee checkout-sources.log
      - name: Run isolated macOS systemwide lab tests
        run: bash scripts/release/systemwide_lab_check.sh systemwide-lab-evidence
      - name: Upload lab evidence
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: systemwide-lab-macos
          path: |
            checkout-sources.log
            systemwide-lab-evidence/
          if-no-files-found: warn
