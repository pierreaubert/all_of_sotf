name: rusty-fork quick-error 2 standalone check
on:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      DISPOSABLE: "1"
      RUSTUP_TOOLCHAIN: "1.99.0"
      PYTHONOPTIMIZE: "0"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare disposable compiler and prerequisites
        run: |
          set -euo pipefail
          test -f /.dockerenv
          test ! -e /dev/snd
          test "$(id -u)" -eq 0
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git git-lfs ca-certificates curl python3 build-essential pkg-config libfontconfig1-dev libfreetype-dev
          if ! command -v rustup >/dev/null 2>&1; then
            curl --fail --location --silent --show-error \
              https://static.rust-lang.org/rustup/dist/x86_64-unknown-linux-gnu/rustup-init \
              --output /tmp/rustup-init
            chmod +x /tmp/rustup-init
            /tmp/rustup-init --default-toolchain 1.99.0 --profile minimal -y --no-modify-path
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install 1.99.0 --profile minimal
          test "$(rustc +1.99.0 --version | awk '{print $2}')" = 1.99.0
      - name: Checkout exact nine sibling revisions
        env:
          GITEA_TOKEN: ${{ secrets.RELEASE_READ_TOKEN }}
        run: python3 scripts/release/checkout_sources.py
      - name: Prove reviewed Linux owned-process supervisor
        run: |
          set -euo pipefail
          mkdir -p target/release-gitea/rusty-fork-candidate
          python3 -m unittest -v scripts.release.test_nih_native_artifact_check 2>&1 | tee target/release-gitea/rusty-fork-candidate/supervisor-preflight.log
          grep -Eq '^Ran 7 tests in ' target/release-gitea/rusty-fork-candidate/supervisor-preflight.log
          grep -Fxq 'OK' target/release-gitea/rusty-fork-candidate/supervisor-preflight.log
          ! grep -Eq 'skipped=|expected failures=' target/release-gitea/rusty-fork-candidate/supervisor-preflight.log
      - name: Prove exact upstream test inventory parser
        run: |
          set -euo pipefail
          python3 -m unittest -v scripts.release.test_rusty_fork_candidate_check 2>&1 | tee target/release-gitea/rusty-fork-candidate/inventory-preflight.log
          grep -Eq '^Ran 6 tests in ' target/release-gitea/rusty-fork-candidate/inventory-preflight.log
          grep -Fxq 'OK' target/release-gitea/rusty-fork-candidate/inventory-preflight.log
          ! grep -Eq 'skipped=|expected failures=' target/release-gitea/rusty-fork-candidate/inventory-preflight.log
      - name: Clone immutable rusty-fork fork
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          set -euo pipefail
          mkdir -p target/release-gitea/rusty-fork-candidate
          GIT_TERMINAL_PROMPT=0 git clone https://github.com/pierreaubert/rusty-fork.git target/release-gitea/rusty-fork-candidate/rusty-fork-source
          git -C target/release-gitea/rusty-fork-candidate/rusty-fork-source checkout --detach ee62bcd64fa6afe7fae0e52a448d716dc294e98d
      - name: Test default, all features, no default, and error source
        run: python3 scripts/release/rusty_fork_candidate_check.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: rusty-fork-candidate-linux
          path: target/release-gitea/rusty-fork-candidate/
          if-no-files-found: error

  macos:
    runs-on: m4
    env:
      CI: "true"
      DISPOSABLE: "1"
      RUSTUP_TOOLCHAIN: "1.99.0"
      PYTHONOPTIMIZE: "0"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require pinned toolchain and Python
        run: |
          set -euo pipefail
          test "$(rustc --version | awk '{print $2}')" = 1.99.0
          python3 -c 'import sys; assert sys.version_info >= (3, 11)'
      - name: Checkout exact nine sibling revisions
        env:
          GITEA_TOKEN: ${{ secrets.RELEASE_READ_TOKEN }}
        run: python3 scripts/release/checkout_sources.py
      - name: Prove reviewed macOS owned-process supervisor
        run: |
          set -euo pipefail
          mkdir -p target/release-gitea/rusty-fork-candidate
          python3 -m unittest -v scripts.release.test_nih_macos_artifact_check 2>&1 | tee target/release-gitea/rusty-fork-candidate/supervisor-preflight.log
          grep -Eq '^Ran 7 tests in ' target/release-gitea/rusty-fork-candidate/supervisor-preflight.log
          grep -Fxq 'OK' target/release-gitea/rusty-fork-candidate/supervisor-preflight.log
          ! grep -Eq 'skipped=|expected failures=' target/release-gitea/rusty-fork-candidate/supervisor-preflight.log
      - name: Prove exact upstream test inventory parser
        run: |
          set -euo pipefail
          python3 -m unittest -v scripts.release.test_rusty_fork_candidate_check 2>&1 | tee target/release-gitea/rusty-fork-candidate/inventory-preflight.log
          grep -Eq '^Ran 6 tests in ' target/release-gitea/rusty-fork-candidate/inventory-preflight.log
          grep -Fxq 'OK' target/release-gitea/rusty-fork-candidate/inventory-preflight.log
          ! grep -Eq 'skipped=|expected failures=' target/release-gitea/rusty-fork-candidate/inventory-preflight.log
      - name: Clone immutable rusty-fork fork
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          set -euo pipefail
          mkdir -p target/release-gitea/rusty-fork-candidate
          GIT_TERMINAL_PROMPT=0 git clone https://github.com/pierreaubert/rusty-fork.git target/release-gitea/rusty-fork-candidate/rusty-fork-source
          git -C target/release-gitea/rusty-fork-candidate/rusty-fork-source checkout --detach ee62bcd64fa6afe7fae0e52a448d716dc294e98d
      - name: Test default, all features, no default, and error source
        run: python3 scripts/release/rusty_fork_candidate_check.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: rusty-fork-candidate-macos
          path: target/release-gitea/rusty-fork-candidate/
          if-no-files-found: error
