name: RNNoise thirteen-clock exact DSP check

on:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    env:
      CI: 'true'
      DISPOSABLE: '1'
      RUSTUP_TOOLCHAIN: 1.99.0
      CARGO_HOME: /root/.cargo
      RUSTUP_HOME: /root/.rustup
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare disposable Linux Rust environment
        run: |
          set -euo pipefail
          test -f /.dockerenv
          test "$(id -u)" -eq 0
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl build-essential clang mold cmake ninja-build pkg-config \
            libssl-dev libasound2-dev libclang-dev
          if ! command -v cargo >/dev/null 2>&1 || ! command -v rustc >/dev/null 2>&1; then
            curl --fail --location --silent --show-error \
              https://static.rust-lang.org/rustup/dist/x86_64-unknown-linux-gnu/rustup-init \
              --output /tmp/rustup-init
            chmod +x /tmp/rustup-init
            /tmp/rustup-init --default-toolchain 1.99.0 --profile minimal -y --no-modify-path
          fi
          export PATH="$CARGO_HOME/bin:$PATH"
          test "$(rustc --version | awk '{print $2}')" = '1.99.0'
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
      - name: Checkout nine pinned siblings
        env:
          GITEA_TOKEN: ${{ secrets.RELEASE_READ_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/release/checkout_sources.py 2>&1 | tee checkout-sources.log
      - name: Verify evidence parser
        run: |
          set -euo pipefail
          mkdir -p target/release-gitea/rnnoise-exact-clock
          python3 -m unittest -v scripts.release.test_rnnoise_exact_clock_check \
            2>&1 | tee target/release-gitea/rnnoise-exact-clock/preflight.log
          grep -Fq 'Ran 4 tests in ' target/release-gitea/rnnoise-exact-clock/preflight.log
          grep -Fxq 'OK' target/release-gitea/rnnoise-exact-clock/preflight.log
      - name: Verify owned Linux process cleanup
        run: |
          set -euo pipefail
          python3 -m unittest -v scripts.release.test_nih_native_artifact_check \
            2>&1 | tee target/release-gitea/rnnoise-exact-clock/supervisor-preflight.log
          grep -Fq 'Ran 7 tests in ' target/release-gitea/rnnoise-exact-clock/supervisor-preflight.log
          grep -Fxq 'OK' target/release-gitea/rnnoise-exact-clock/supervisor-preflight.log
          ! grep -Eq 'skipped=|expected failures=' target/release-gitea/rnnoise-exact-clock/supervisor-preflight.log
      - name: Run thirteen-clock and retained DSP oracles
        run: |
          set -euo pipefail
          python3 scripts/release/rnnoise_exact_clock_check.py
      - name: Upload Linux evidence
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: rnnoise-exact-clock-linux
          path: |
            checkout-sources.log
            target/release-gitea/rnnoise-exact-clock/
          if-no-files-found: error
  macos:
    runs-on: m4
    env:
      CI: 'true'
      DISPOSABLE: '1'
      RUSTUP_TOOLCHAIN: 1.99.0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify macOS Rust toolchain
        run: |
          set -euo pipefail
          test "$(rustc --version | awk '{print $2}')" = '1.99.0'
          command -v cargo clang cmake python3
      - name: Checkout nine pinned siblings
        env:
          GITEA_TOKEN: ${{ secrets.RELEASE_READ_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/release/checkout_sources.py 2>&1 | tee checkout-sources.log
      - name: Verify evidence parser
        run: |
          set -euo pipefail
          mkdir -p target/release-gitea/rnnoise-exact-clock
          python3 -m unittest -v scripts.release.test_rnnoise_exact_clock_check \
            2>&1 | tee target/release-gitea/rnnoise-exact-clock/preflight.log
          grep -Fq 'Ran 4 tests in ' target/release-gitea/rnnoise-exact-clock/preflight.log
          grep -Fxq 'OK' target/release-gitea/rnnoise-exact-clock/preflight.log
      - name: Verify owned macOS process cleanup
        run: |
          set -euo pipefail
          python3 -m unittest -v scripts.release.test_nih_macos_artifact_check \
            2>&1 | tee target/release-gitea/rnnoise-exact-clock/supervisor-preflight.log
          grep -Fq 'Ran 7 tests in ' target/release-gitea/rnnoise-exact-clock/supervisor-preflight.log
          grep -Fxq 'OK' target/release-gitea/rnnoise-exact-clock/supervisor-preflight.log
          ! grep -Eq 'skipped=|expected failures=' target/release-gitea/rnnoise-exact-clock/supervisor-preflight.log
      - name: Run thirteen-clock and retained DSP oracles
        run: |
          set -euo pipefail
          python3 scripts/release/rnnoise_exact_clock_check.py
      - name: Upload macOS evidence
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: rnnoise-exact-clock-macos
          path: |
            checkout-sources.log
            target/release-gitea/rnnoise-exact-clock/
          if-no-files-found: error
