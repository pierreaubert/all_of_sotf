name: Validate generated RoomEQ graph artifacts

on:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: 1.99.0
      CARGO_HOME: /root/.cargo
      RUSTUP_HOME: /root/.rustup
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare disposable compiler environment
        run: |
          set -euo pipefail
          if [ ! -f /.dockerenv ] || [ "$(id -u)" -ne 0 ] || [ -e /dev/snd ]; then
            echo 'Generated RoomEQ check requires an audio-device-free disposable container' >&2
            exit 1
          fi
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl build-essential clang mold cmake ninja-build pkg-config \
            libssl-dev libasound2-dev libjack-jackd2-dev libclang-dev \
            libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libfontconfig1-dev \
            libfreetype6-dev libwayland-dev libx11-xcb-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxrandr-dev libxi-dev \
            libxcursor-dev libegl1-mesa-dev libgl1-mesa-dev libgl1-mesa-dri
          if ! command -v cargo >/dev/null 2>&1 || ! command -v rustc >/dev/null 2>&1; then
            curl --fail --location --silent --show-error \
              https://static.rust-lang.org/rustup/dist/x86_64-unknown-linux-gnu/rustup-init \
              --output /tmp/rustup-init
            chmod +x /tmp/rustup-init
            /tmp/rustup-init --default-toolchain 1.99.0 --profile minimal -y --no-modify-path
          fi
          export PATH="$CARGO_HOME/bin:$PATH"
          test "$(rustc --version | awk '{print $2}')" = 1.99.0
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
      - name: Checkout pinned sibling repositories
        env:
          GITEA_TOKEN: ${{ secrets.RELEASE_READ_TOKEN }}
        run: |
          set -o pipefail
          python3 scripts/release/checkout_sources.py 2>&1 | tee checkout-sources.log
      - name: Preflight owned-process stopping and cleanup
        run: |
          set -o pipefail
          python3 -m unittest scripts.release.test_generated_roomeq_check -v 2>&1 | tee generated-roomeq-preflight.log
          grep -Eq '^Ran 2 tests in ' generated-roomeq-preflight.log
          grep -Fq 'test_stop_before_launch' generated-roomeq-preflight.log
          grep -Fq 'test_real_signal_stops_ready_parent_and_descendant' generated-roomeq-preflight.log
      - name: Generate artifacts and run ignored graph test
        run: python3 scripts/release/generated_roomeq_check.py
      - name: Upload generated RoomEQ evidence
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: generated-roomeq-linux
          path: |
            checkout-sources.log
            generated-roomeq-preflight.log
            target/release-gitea/generated-roomeq-evidence/
          if-no-files-found: error
