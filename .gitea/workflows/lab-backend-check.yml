name: Isolated systemwide lab diagnostics and QA

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Diagnostic runs focused tests only and is NOT full QA
        type: choice
        options: [diagnostic, full]
        default: diagnostic
      platform:
        description: Runner platform
        type: choice
        options: [all, macos, linux]
        default: all

jobs:
  macos:
    if: inputs.platform == 'all' || inputs.platform == 'macos'
    runs-on: m4
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require Python 3.11 or newer
        run: python3 -c 'import sys; print(sys.version); assert sys.version_info >= (3, 11), "Python 3.11+ required"'
      - name: Checkout pinned sibling repositories
        env:
          GITEA_TOKEN: ${{ secrets.RELEASE_READ_TOKEN }}
        run: |
          set -o pipefail
          python3 scripts/release/checkout_sources.py 2>&1 | tee checkout-sources.log
      - name: Test engine and isolated systemwide lab (${{ inputs.phase }})
        run: bash scripts/release/lab_backend_check.sh macos lab-backend-evidence-macos "${{ inputs.phase }}"
      - name: Upload macOS lab evidence
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: lab-backend-macos
          path: |
            checkout-sources.log
            lab-backend-evidence-macos/
          if-no-files-found: warn

  linux:
    if: inputs.platform == 'all' || inputs.platform == 'linux'
    runs-on: x86:linux:host
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require Python 3.11 or newer
        run: python3 -c 'import sys; print(sys.version); assert sys.version_info >= (3, 11), "Python 3.11+ required"'
      - name: Checkout pinned sibling repositories
        env:
          GITEA_TOKEN: ${{ secrets.RELEASE_READ_TOKEN }}
        run: |
          set -o pipefail
          python3 scripts/release/checkout_sources.py 2>&1 | tee checkout-sources.log
      - name: Test engine and IPC lab (${{ inputs.phase }})
        run: bash scripts/release/lab_backend_check.sh linux lab-backend-evidence-linux "${{ inputs.phase }}"
      - name: Upload Linux lab evidence
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: lab-backend-linux
          path: |
            checkout-sources.log
            lab-backend-evidence-linux/
          if-no-files-found: warn
