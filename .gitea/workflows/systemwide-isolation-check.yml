name: Focused systemwide lab isolation proof

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Runner platform
        type: choice
        options: [all, macos, linux]
        default: all

jobs:
  macos:
    if: inputs.platform == 'all' || inputs.platform == 'macos'
    runs-on: m4
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require Python 3.11 or newer
        run: python3 -c 'import sys; print(sys.version); assert sys.version_info >= (3, 11), "Python 3.11+ required"'
      - name: Checkout pinned sibling repositories
        env:
          GITEA_TOKEN: ${{ secrets.RELEASE_READ_TOKEN }}
        run: |
          set -o pipefail
          python3 scripts/release/checkout_sources.py 2>&1 | tee checkout-sources.log
      - name: Run focused isolated systemwide tests
        run: python3 scripts/release/systemwide_isolation_check.py macos systemwide-isolation-macos
      - name: Upload macOS evidence
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: systemwide-isolation-macos
          path: |
            checkout-sources.log
            systemwide-isolation-macos/
          if-no-files-found: warn

  linux:
    if: inputs.platform == 'all' || inputs.platform == 'linux'
    runs-on: x86:linux:host
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require Python 3.11 or newer
        run: python3 -c 'import sys; print(sys.version); assert sys.version_info >= (3, 11), "Python 3.11+ required"'
      - name: Checkout pinned sibling repositories
        env:
          GITEA_TOKEN: ${{ secrets.RELEASE_READ_TOKEN }}
        run: |
          set -o pipefail
          python3 scripts/release/checkout_sources.py 2>&1 | tee checkout-sources.log
      - name: Run focused isolated systemwide tests
        run: python3 scripts/release/systemwide_isolation_check.py linux systemwide-isolation-linux
      - name: Upload Linux evidence
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: systemwide-isolation-linux
          path: |
            checkout-sources.log
            systemwide-isolation-linux/
          if-no-files-found: warn
