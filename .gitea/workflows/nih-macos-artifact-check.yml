name: Full macOS NIH plugin artifact and validator check

on:
  workflow_dispatch:

jobs:
  macos:
    runs-on: m4
    env:
      CI: 'true'
      RELEASE_MAC_NONHARDWARE: '1'
      RUSTUP_TOOLCHAIN: 1.99.0
      PYTHONOPTIMIZE: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require pinned Apple Silicon build prerequisites
        run: |
          set -euo pipefail
          mkdir -p target/release-gitea/nih-macos
          exec > >(tee target/release-gitea/nih-macos/prerequisite.log) 2>&1
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          python3 -c 'import sys; assert sys.version_info >= (3, 11), "Python 3.11+ required"'
          for tool in rustc cargo just swift xcodebuild curl shasum ditto tar file; do
            command -v "$tool"
          done
          test "$(rustc --version | awk '{print $2}')" = '1.99.0'
          test "$(just --version)" = 'just 1.58.0'
          swift --version
          xcodebuild -version
      - name: Checkout exact nine sibling sources
        env:
          GITEA_TOKEN: ${{ secrets.RELEASE_READ_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/release/checkout_sources.py 2>&1 | tee checkout-sources.log
      - name: Verify macOS artifact supervisor and inventories
        run: |
          set -euo pipefail
          python3 -m unittest -v scripts.release.test_nih_macos_artifact_check \
            2>&1 | tee target/release-gitea/nih-macos/supervisor-preflight.log
          grep -Fq 'Ran 8 tests in ' target/release-gitea/nih-macos/supervisor-preflight.log
          grep -Fxq 'OK' target/release-gitea/nih-macos/supervisor-preflight.log
          if grep -Eq 'skipped=|expected failures=' target/release-gitea/nih-macos/supervisor-preflight.log; then
            echo 'supervisor preflight skipped or expected a failure' >&2
            exit 1
          fi
      - name: Build and validate all 43 NIH CLAP and VST3 artifacts
        run: |
          set -euo pipefail
          python3 scripts/release/nih_macos_artifact_check.py
      - name: Upload macOS plugin artifacts and evidence
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: release-nih-macos
          path: |
            checkout-sources.log
            target/release-gitea/nih-macos/
          if-no-files-found: error
