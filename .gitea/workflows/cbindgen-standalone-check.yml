name: cbindgen TOML candidate standalone check

on:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      DISPOSABLE: "1"
      RUSTUP_TOOLCHAIN: "1.99.0"
      PYTHONOPTIMIZE: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      CARGO_HOME: /root/.cargo
      RUSTUP_HOME: /root/.rustup
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare disposable compiler and header tools
        run: |
          set -euo pipefail
          test -f /.dockerenv
          test "$(id -u)" -eq 0
          test ! -e /dev/snd
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git ca-certificates curl python3 build-essential cmake cython3
          if ! command -v rustup >/dev/null 2>&1; then
            curl --fail --location --silent --show-error \
              https://static.rust-lang.org/rustup/dist/x86_64-unknown-linux-gnu/rustup-init \
              --output /tmp/rustup-init
            chmod +x /tmp/rustup-init
            /tmp/rustup-init --default-toolchain 1.99.0 --profile minimal -y --no-modify-path
            echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
            export PATH="$CARGO_HOME/bin:$PATH"
          fi
          rustup toolchain install 1.99.0 --profile minimal
          test "$(rustc +1.99.0 --version | awk '{print $2}')" = 1.99.0
          command -v gcc
          command -v g++
          command -v cython
          command -v cmake
      - name: Checkout exact nine sibling revisions
        env:
          GITEA_TOKEN: ${{ secrets.RELEASE_READ_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/release/checkout_sources.py
      - name: Use a private empty test home
        run: |
          set -euo pipefail
          test -d "$CARGO_HOME"
          test -d "$RUSTUP_HOME"
          mkdir -p target/release-gitea/cbindgen-standalone/private-home/.cargo
          echo "HOME=$PWD/target/release-gitea/cbindgen-standalone/private-home" >> "$GITHUB_ENV"
      - name: Prove owned-process and fixture parsers
        run: |
          set -euo pipefail
          mkdir -p target/release-gitea/cbindgen-standalone
          python3 -m unittest -v scripts.release.test_nih_native_artifact_check 2>&1 | tee target/release-gitea/cbindgen-standalone/supervisor-preflight.log
          grep -Eq '^Ran 7 tests in ' target/release-gitea/cbindgen-standalone/supervisor-preflight.log
          grep -Fxq 'OK' target/release-gitea/cbindgen-standalone/supervisor-preflight.log
          ! grep -Eq 'skipped=|expected failures=' target/release-gitea/cbindgen-standalone/supervisor-preflight.log
          python3 -m unittest -v scripts.release.test_cbindgen_standalone_check 2>&1 | tee target/release-gitea/cbindgen-standalone/parser-preflight.log
          grep -Eq '^Ran 4 tests in ' target/release-gitea/cbindgen-standalone/parser-preflight.log
          grep -Fxq 'OK' target/release-gitea/cbindgen-standalone/parser-preflight.log
          ! grep -Eq 'skipped=|expected failures=' target/release-gitea/cbindgen-standalone/parser-preflight.log
      - name: Check immutable fork and upstream header fixtures
        run: python3 scripts/release/cbindgen_standalone_check.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: cbindgen-standalone-linux
          path: target/release-gitea/cbindgen-standalone/
          if-no-files-found: error

  macos:
    runs-on: m4
    env:
      CI: "true"
      DISPOSABLE: "1"
      RUSTUP_TOOLCHAIN: "1.99.0"
      PYTHONOPTIMIZE: "0"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require pinned compiler and header tools
        run: |
          set -euo pipefail
          test "$(rustc --version | awk '{print $2}')" = 1.99.0
          python3 -c 'import sys; assert sys.version_info >= (3, 11)'
          command -v gcc
          command -v g++
          command -v cython
          command -v cmake
      - name: Checkout exact nine sibling revisions
        env:
          GITEA_TOKEN: ${{ secrets.RELEASE_READ_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/release/checkout_sources.py
      - name: Use a private empty test home
        run: |
          set -euo pipefail
          ORIGINAL_HOME="$HOME"
          echo "CARGO_HOME=${CARGO_HOME:-$ORIGINAL_HOME/.cargo}" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=${RUSTUP_HOME:-$ORIGINAL_HOME/.rustup}" >> "$GITHUB_ENV"
          mkdir -p target/release-gitea/cbindgen-standalone/private-home/.cargo
          echo "HOME=$PWD/target/release-gitea/cbindgen-standalone/private-home" >> "$GITHUB_ENV"
      - name: Prove owned-process and fixture parsers
        run: |
          set -euo pipefail
          mkdir -p target/release-gitea/cbindgen-standalone
          python3 -m unittest -v scripts.release.test_nih_macos_artifact_check 2>&1 | tee target/release-gitea/cbindgen-standalone/supervisor-preflight.log
          grep -Eq '^Ran 7 tests in ' target/release-gitea/cbindgen-standalone/supervisor-preflight.log
          grep -Fxq 'OK' target/release-gitea/cbindgen-standalone/supervisor-preflight.log
          ! grep -Eq 'skipped=|expected failures=' target/release-gitea/cbindgen-standalone/supervisor-preflight.log
          python3 -m unittest -v scripts.release.test_cbindgen_standalone_check 2>&1 | tee target/release-gitea/cbindgen-standalone/parser-preflight.log
          grep -Eq '^Ran 4 tests in ' target/release-gitea/cbindgen-standalone/parser-preflight.log
          grep -Fxq 'OK' target/release-gitea/cbindgen-standalone/parser-preflight.log
          ! grep -Eq 'skipped=|expected failures=' target/release-gitea/cbindgen-standalone/parser-preflight.log
      - name: Check immutable fork and upstream header fixtures
        run: python3 scripts/release/cbindgen_standalone_check.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: cbindgen-standalone-macos
          path: target/release-gitea/cbindgen-standalone/
          if-no-files-found: error
