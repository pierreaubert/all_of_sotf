name: Strict original 108-case Metal visual evidence

on:
  workflow_dispatch:

jobs:
  metal:
    runs-on: m4
    env:
      CI: 'true'
      SOTF_GITEA_DISPOSABLE_RUNNER: '1'
      PYTHONOPTIMIZE: '0'
      PYTHONDONTWRITEBYTECODE: '1'
      RUSTUP_TOOLCHAIN: '1.99.0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require pinned toolchain and preserve original Rust homes
        run: |
          set -euo pipefail
          python3 -c 'import sys; assert sys.version_info >= (3, 11) and sys.flags.optimize == 0'
          original_cargo_home="$(python3 -c 'import os, pathlib; print(pathlib.Path(os.environ.get("CARGO_HOME") or pathlib.Path.home() / ".cargo").resolve(strict=True))')"
          original_rustup_home="$(python3 -c 'import os, pathlib; print(pathlib.Path(os.environ.get("RUSTUP_HOME") or pathlib.Path.home() / ".rustup").resolve(strict=True))')"
          mkdir -p target/release-gitea/ui108-metal/private-home/.cargo
          echo "HOME=$PWD/target/release-gitea/ui108-metal/private-home" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$original_cargo_home" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$original_rustup_home" >> "$GITHUB_ENV"
          test "$(rustc --version | awk '{print $2}')" = '1.99.0'
      - name: Checkout exact nine pinned workspaces
        env:
          GITEA_TOKEN: ${{ secrets.RELEASE_READ_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/release/checkout_sources.py 2>&1 | tee target/release-gitea/ui108-metal/checkout.log
      - name: Run reviewed Mac owned-process preflights
        run: |
          set -euo pipefail
          python3 -m unittest scripts.release.test_nih_macos_artifact_check -v 2>&1 |
            tee target/release-gitea/ui108-metal/supervisor-preflight.log
          grep -q 'Ran 7 tests' target/release-gitea/ui108-metal/supervisor-preflight.log
          grep -q '^OK$' target/release-gitea/ui108-metal/supervisor-preflight.log
          ! grep -Eiq 'skipped|expected failure|unexpected success' target/release-gitea/ui108-metal/supervisor-preflight.log
      - name: Capture original baselines, actual Metal images and zero-pixel diffs
        run: python3 scripts/release/ui108_metal_evidence.py
      - name: Upload complete visual evidence, including failures
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: ui108-metal-original-baseline-evidence
          path: target/release-gitea/ui108-metal/
          if-no-files-found: error
