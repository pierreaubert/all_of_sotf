name: AUD132 canonical input diagnostic

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Diagnostic runner platform
        type: choice
        options: [all, macos, linux]
        default: all

jobs:
  macos:
    if: inputs.platform == 'all' || inputs.platform == 'macos'
    runs-on: m4
    env:
      RUSTUP_TOOLCHAIN: 1.99.0
      CI: 'true'
      DISPOSABLE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout exact sibling sources
        env:
          GITEA_TOKEN: ${{ secrets.RELEASE_READ_TOKEN }}
        run: python3 scripts/release/checkout_sources.py
      - name: Check AUD132 diagnostic guards
        run: |
          set -euo pipefail
          mkdir -p target/release-gitea/aud132-canonical-macos
          python3 -m unittest -v scripts.release.test_aud132_canonical_input_check \
            > target/release-gitea/aud132-canonical-macos/preflight.log 2>&1
          grep -Eq '^Ran 4 tests in ' target/release-gitea/aud132-canonical-macos/preflight.log
          grep -Eq '^OK$' target/release-gitea/aud132-canonical-macos/preflight.log
          ! grep -Eq 'skipped|expected failure|unexpected success' target/release-gitea/aud132-canonical-macos/preflight.log
      - name: Compare native and canonical AUD132 input paths
        run: python3 scripts/release/aud132_canonical_input_check.py target/release-gitea/aud132-canonical-macos
      - name: Retain macOS diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: aud132-canonical-macos
          path: target/release-gitea/aud132-canonical-macos/
          if-no-files-found: error

  linux:
    if: inputs.platform == 'all' || inputs.platform == 'linux'
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: 1.99.0
      CARGO_HOME: /root/.cargo
      RUSTUP_HOME: /root/.rustup
      CI: 'true'
      DISPOSABLE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare disposable Linux audio build prerequisites
        run: |
          set -euo pipefail
          test -f /.dockerenv
          test "$(id -u)" -eq 0
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl build-essential clang mold cmake ninja-build pkg-config \
            python3 python3-dev libssl-dev libasound2-dev libclang-dev \
            libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libfontconfig1-dev \
            libfreetype6-dev libwayland-dev libx11-xcb-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxrandr-dev libxi-dev \
            libxcursor-dev libegl1-mesa-dev libgl1-mesa-dev
          if ! command -v cargo >/dev/null 2>&1; then
            curl --fail --location --silent --show-error \
              https://static.rust-lang.org/rustup/dist/x86_64-unknown-linux-gnu/rustup-init \
              --output /tmp/rustup-init
            chmod +x /tmp/rustup-init
            /tmp/rustup-init --default-toolchain 1.99.0 --profile minimal -y --no-modify-path
          fi
          export PATH="$CARGO_HOME/bin:$PATH"
          test "$(rustc --version | awk '{print $2}')" = 1.99.0
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
      - name: Checkout exact sibling sources
        env:
          GITEA_TOKEN: ${{ secrets.RELEASE_READ_TOKEN }}
        run: python3 scripts/release/checkout_sources.py
      - name: Check AUD132 diagnostic guards
        run: |
          set -euo pipefail
          mkdir -p target/release-gitea/aud132-canonical-linux
          python3 -m unittest -v scripts.release.test_aud132_canonical_input_check \
            > target/release-gitea/aud132-canonical-linux/preflight.log 2>&1
          grep -Eq '^Ran 4 tests in ' target/release-gitea/aud132-canonical-linux/preflight.log
          grep -Eq '^OK$' target/release-gitea/aud132-canonical-linux/preflight.log
          ! grep -Eq 'skipped|expected failure|unexpected success' target/release-gitea/aud132-canonical-linux/preflight.log
      - name: Compare native and canonical AUD132 input paths
        run: python3 scripts/release/aud132_canonical_input_check.py target/release-gitea/aud132-canonical-linux
      - name: Retain Linux diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: aud132-canonical-linux
          path: target/release-gitea/aud132-canonical-linux/
          if-no-files-found: error
