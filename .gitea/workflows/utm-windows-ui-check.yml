name: Windows UTM native UI release check

on:
  workflow_dispatch:

jobs:
  windows-utm:
    runs-on: m4
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require Python 3.11 or newer
        run: python3 -c 'import sys; print(sys.version); assert sys.version_info >= (3, 11), "Python 3.11+ required"'
      - name: Checkout pinned sibling sources
        env:
          GITEA_TOKEN: ${{ secrets.RELEASE_READ_TOKEN }}
        run: |
          set -o pipefail
          python3 scripts/release/checkout_sources.py 2>&1 | tee checkout-sources.log
      - name: Check Windows compile and native UI in configured UTM guest
        run: |
          set -o pipefail
          python3 scripts/release/with_utm_vm_lock.py \
            --vm "${GPUI_UTM_WINDOWS_VM:-Win11 ARM AutoEQ}" -- \
            bash gpui-toolkit/scripts/run_utm_windows_native_ui_smoke.sh \
              gpui-toolkit/target/qa/native-ui/windows/gpui-builder-smoke.json \
              gpui-toolkit/target/qa/native-ui/windows/gpui-builder.png \
            2>&1 | tee utm-windows-ui.log
      - name: Upload Windows UTM evidence
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: utm-windows-ui-macos
          path: |
            checkout-sources.log
            utm-windows-ui.log
            gpui-toolkit/target/qa/native-ui/windows/
          if-no-files-found: warn
