# Cargo configuration for the aggregate (mono) workspace.
# Union of the member repos' .cargo/config.toml files: mono builds read only
# this config, never the per-repo ones. Standalone repo builds are unaffected
# (each repo keeps its own config).
# Differences from the per-repo files, all deliberate:
# - `jobs` is unset: math-audio pins 64 for a 64-thread EPYC, the other repos
#   use the host default; mono follows the majority (host default).
# - the machine-specific `-L /opt/homebrew/Cellar/llvm/...` link path present
#   in some repos is omitted (it does not exist on every machine; cargo finds
#   the framework paths without it).
# - the wasm32 table comes from autoeq (needed by autoeq-report-wasm).

[env]
# macOS-specific configuration
MACOSX_DEPLOYMENT_TARGET = "15.0"
# Disabled: -Zthreads is nightly-only and the pinned toolchain is stable,
# so any cargo invocation fails while this is set.
# RUSTFLAGS = "-Zthreads=8"

[build]
# No workspace-wide target-cpu: `native` here silently applies to any
# target without an explicit section below and ships build-machine
# instructions (AMD SSE4a from a Zen builder -> SIGILL on every Intel
# CPU, sotf#246). Every shipped target pins its own baseline below;
# anything unlisted builds for the portable generic CPU (fail-safe).
# jobs intentionally unset: cargo defaults to the logical CPU count.
# Disabled: sccache is not installed in this environment; re-enable where
# the wrapper exists.
# rustc-wrapper = "sccache"

# macOS Apple Silicon (M1-M5) - using Accelerate framework
[target.aarch64-apple-darwin]
rustflags = [
  "-C", 'target-cpu=native',
  "-C", 'target-feature=+neon',
  "-C", "link-arg=-framework",
  "-C", "link-arg=Accelerate",
  "-C", "link-arg=-L /Applications/Xcode.app/Contents/Frameworks",
]

# macOS Intel - using Accelerate framework, untested
[target.x86_64-apple-darwin]
rustflags = [
  "-C", "target-feature=+sse,+sse2,+sse3,+ssse3,+sse4.1,+sse4.2,+avx,+avx2",
  "-C", "link-arg=-mmacosx-version-min=15.0",
  "-C", "link-arg=-framework", "-C", "link-arg=Accelerate"
]

# ----------------------------------------------------------------------
# Linux x86 use mold
# ----------------------------------------------------------------------

[target.x86_64-unknown-linux-gnu]
# Use mold for lightning-fast parallel linking
linker = "clang"
rustflags = [
  "-C", "link-arg=-fuse-ld=mold",
  # Portable x86-64-v2 baseline for shipped binaries (AppImage/tarball).
  # Floor hardware is Apollo Lake (Celeron J3455): full v2 set, no AVX
  # at all, so no AVX/AVX2/FMA/BMI instruction may appear outside
  # runtime-dispatched kernels. target-cpu=native on the AMD release
  # builder emitted AMD-only SSE4a and SIGILLed on every Intel CPU
  # (sotf#246). DSP SIMD kernels are runtime-dispatched, so modern
  # CPUs keep their AVX2/FMA paths.
  "-C", "target-cpu=x86-64-v2",
  "-C", "symbol-mangling-version=v0",
]

# Linux ARM64 configuration
[target.aarch64-unknown-linux-gnu]
rustflags = [
  "-C", 'target-feature=+neon',
]

# wasm32 (from autoeq): pin the standard wasm feature set explicitly
# for this target (notably `reference-types`, which wasm-bindgen needs).
[target.wasm32-unknown-unknown]
rustflags = [
  "-C",
  "target-feature=+bulk-memory,+mutable-globals,+reference-types,+sign-ext",
]

# Windows MSVC x86_64 configuration. Default CRT linkage (dynamic) is fine;
# the MSIX declares the VCLibs framework dependency.
[target.x86_64-pc-windows-msvc]
rustflags = [
  "-C", "target-feature=+sse,+sse2,+sse3,+ssse3,+sse4.1,+sse4.2,+avx,+avx2",
]

# Windows MSVC ARM configuration.
[target.aarch64-pc-windows-msvc]
rustflags = [
  "-C", 'target-feature=+neon',
]

# Windows GNU x86_64 configuration, untested
[target.x86_64-pc-windows-gnu]
rustflags = [
]

# Windows GNU (llvm-mingw/gnullvm) — used by the Docker Windows builds.
# Mirrors the MSVC sections above.
[target.x86_64-pc-windows-gnullvm]
rustflags = [
  "-C", "target-feature=+sse,+sse2,+sse3,+ssse3,+sse4.1,+sse4.2,+avx,+avx2",
]

[target.aarch64-pc-windows-gnullvm]
rustflags = [
  "-C", 'target-feature=+neon',
]

# Linux x86_64 musl configuration (static linking). Same x86-64-v2
# baseline as gnu: forcing +avx,+avx2 here SIGILLs on the Apollo Lake
# floor machines (no AVX at all).
[target.x86_64-unknown-linux-musl]
rustflags = [
  "-C", "target-feature=+crt-static",
  "-C", "target-cpu=x86-64-v2",
]

# Linux ARM64 musl configuration (static linking)
[target.aarch64-unknown-linux-musl]
rustflags = [
  "-C", "target-feature=+crt-static",
  "-C", "target-feature=+neon",
]
