def platform_root(platform_name):
    if platform_name == "macos":
        return REPO_ROOT
    if platform_name == "linux":
        return LINUX_ROOT
    if platform_name == "windows":
        return WINDOWS_ROOT
    raise ValueError(f"unknown platform: {platform_name}")


def step_env(platform_name, workspace_name):
    env = {"CARGO_TERM_COLOR": "never"}
    if platform_name == "linux":
        env["CARGO_TARGET_DIR"] = f"{LINUX_ROOT}/target/{workspace_name}"
    return env


def add_version_steps(factory, workspace_name, platform_name, root, python):
    workspace_dir = f"{root}/{workspace_name}"
    script = f"{root}/scripts/buildbot/version_snapshot.py"
    factory.addStep(
        steps.SetPropertyFromCommand(
            name="tested-revision",
            command=["git", "rev-parse", "HEAD"],
            property="tested_revision",
            workdir=workspace_dir,
            haltOnFailure=True,
        )
    )
    factory.addStep(
        steps.SetPropertyFromCommand(
            name="version-snapshot",
            command=[
                python,
                script,
                "--workspace",
                workspace_dir,
                "--platform-label",
                platform_name,
            ],
            property="version_snapshot",
            workdir=workspace_dir,
            haltOnFailure=True,
        )
    )


def recipe_factory(workspace, platform, recipes, timeout):
    root = platform_root(platform.name)
    workspace_dir = f"{root}/{workspace.name}"
    env = step_env(platform.name, workspace.name)
    factory = util.BuildFactory()
    add_version_steps(
        factory, workspace.name, platform.name, root, platform.python
    )
    for recipe in recipes:
        factory.addStep(
            steps.ShellCommand(
                name=recipe,
                command=["just", recipe],
                workdir=workspace_dir,
                env=env,
                timeout=timeout,
                haltOnFailure=True,
            )
        )
    return factory


def target_factory(target):
    workspace_dir = f"{target.root}/{target.workspace}"
    factory = util.BuildFactory()
    add_version_steps(
        factory,
        target.workspace,
        target.name,
        target.root,
        target.python,
    )
    env = {"CARGO_TERM_COLOR": "never"}
    if "android" in target.name:
        env.update(
            {
                "ANDROID_HOME": os.environ.get("ANDROID_HOME", "/opt/android-sdk"),
                "ANDROID_SDK_ROOT": os.environ.get("ANDROID_SDK_ROOT", "/opt/android-sdk"),
                "ANDROID_NDK_VERSION": os.environ.get(
                    "ANDROID_NDK_VERSION", "27.2.12479018"
                ),
            }
        )
    factory.addStep(
        steps.ShellCommand(
            name=target.recipe,
            command=["just", target.recipe],
            workdir=workspace_dir,
            env=env,
            timeout=7200,
            haltOnFailure=True,
        )
    )
    return factory


def root_qa_factory():
    factory = util.BuildFactory()
    add_version_steps(factory, ".", "macos", REPO_ROOT, "python3")
    for name, command in (
        ("align-crates", ["python3", "scripts/align-crates/align_crate_versions.py"]),
        ("quality-matrix", ["python3", "scripts/quality-matrix/collect.py"]),
    ):
        factory.addStep(
            steps.ShellCommand(
                name=name,
                command=command,
                workdir=REPO_ROOT,
                haltOnFailure=True,
            )
        )
    return factory


def buildbot_smoke_factory():
    factory = util.BuildFactory()
    add_version_steps(factory, ".", "macos", REPO_ROOT, "python3")
    factory.addStep(
        steps.ShellCommand(
            name="validate-buildbot",
            command=["just", "validate"],
            workdir=f"{REPO_ROOT}/scripts/buildbot",
            timeout=300,
            haltOnFailure=True,
        )
    )
    return factory


def linux_smoke_factory():
    factory = util.BuildFactory()
    add_version_steps(factory, ".", "linux", LINUX_ROOT, "python3")
    factory.addStep(
        steps.ShellCommand(
            name="linux-toolchain",
            command=["cargo", "nextest", "--version"],
            workdir=LINUX_ROOT,
            timeout=120,
            haltOnFailure=True,
        )
    )
    return factory


c["builders"] = []
builder_names = []
for workspace in WORKSPACES:
    for platform in DESKTOP_PLATFORMS:
        tests_name = f"{workspace.name}-{platform.name}-tests"
        qa_name = f"{workspace.name}-{platform.name}-qa"
        c["builders"].append(
            util.BuilderConfig(
                name=tests_name,
                workernames=[platform.worker],
                factory=recipe_factory(
                    workspace, platform, workspace.test_recipes, timeout=7200
                ),
                tags=[workspace.name, platform.name, "tests"],
            )
        )
        c["builders"].append(
            util.BuilderConfig(
                name=qa_name,
                workernames=[platform.worker],
                factory=recipe_factory(
                    workspace, platform, (workspace.qa_recipe,), timeout=14400
                ),
                tags=[workspace.name, platform.name, "qa"],
            )
        )
        builder_names.extend((tests_name, qa_name))

for target in TARGET_BUILDS:
    c["builders"].append(
        util.BuilderConfig(
            name=target.name,
            workernames=[target.worker],
            factory=target_factory(target),
            tags=[target.workspace, "target"],
        )
    )
    builder_names.append(target.name)

