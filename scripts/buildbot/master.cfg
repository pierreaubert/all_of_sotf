c["schedulers"] = []
for workspace in WORKSPACES:
    # Commit builds provide prompt cross-platform feedback without launching
    # the multi-hour QA suite. Full QA is scheduled nightly and forceable.
    c["schedulers"].append(
        schedulers.SingleBranchScheduler(
            name=f"{workspace.name}-commit",
            change_filter=util.ChangeFilter(
                project=workspace.name, branch=workspace.branch
            ),
            treeStableTimer=60,
            builderNames=list(
                desktop_builder_names(workspace.name, include_qa=False)
            ),
        )
    )
    c["schedulers"].append(
        schedulers.Nightly(
            name=f"{workspace.name}-nightly",
            branch=workspace.branch,
            builderNames=list(nightly_builder_names(workspace.name)),
            hour=2,
            minute=0,
        )
    )

c["schedulers"].append(
    schedulers.Nightly(
        name="root-nightly",
        branch="main",
        builderNames=["root-qa-macos"],
        hour=2,
        minute=0,
    )
)
for builder_name in builder_names:
    c["schedulers"].append(
        schedulers.ForceScheduler(
            name=f"force-{builder_name}", builderNames=[builder_name]
        )
    )

