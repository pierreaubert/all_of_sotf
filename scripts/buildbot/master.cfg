# Buildbot's React routes need an index.html fallback when opened directly.
class SpaIndexResource(www_config.IndexResource):
    @defer.inlineCallbacks
    def renderIndex(self, request):
        html = yield super().renderIndex(request)
        return html.replace(b"</head>", b'<base href="/">\n</head>')


www_config.IndexResource = SpaIndexResource
_original_setup_site = www_service.WWWService.setupSite


def _setup_site(self, new_config):
    _original_setup_site(self, new_config)
    index_resource = self.root.children.get(b"")
    if index_resource is not None:
        self.root.childNotFound = index_resource


www_service.WWWService.setupSite = _setup_site

