import shlex

from buildbot.plugins import *
from buildbot.www import service as www_service

# ---------------------------------------------------------------------------
# SPA fallback for the React dashboard
# ---------------------------------------------------------------------------
# Buildbot mounts IndexResource only at the root path ('/').  Direct links
# to React Router views such as /console, /grid and /waterfall therefore hit
# the static File resource, which returns 404 for unknown files.  Patch the
# www service so that any unmatched path under the root serves index.html
# instead, letting the React app render the requested view.
# ---------------------------------------------------------------------------
_orig_setupSite = www_service.WWWService.setupSite


def _setupSite(self, new_config):
    _orig_setupSite(self, new_config)
    index_resource = self.root.children.get(b'')
    if index_resource is not None:
        self.root.childNotFound = index_resource


www_service.WWWService.setupSite = _setupSite

REPO_ROOT = '/Volumes/home_ext1/src_pierre/all_of_sotf'

WORKSPACES = [
    {'name': 'sotf', 'branch': 'master'},
    {'name': 'autoeq', 'branch': 'main'},
    {'name': 'gpui-toolkit', 'branch': 'main'},
    {'name': 'math-audio', 'branch': 'main'},
    {'name': 'sofa-reader', 'branch': 'main'},
    {'name': 'symphonia-add-ons', 'branch': 'main'},
]

c = BuildmasterConfig = {}

c['title'] = 'SOTF CI'
c['titleURL'] = 'http://localhost:8010/'
c['buildbotURL'] = 'http://localhost:8010/'

# Disable Buildbot usage telemetry.
c['buildbotNetUsageData'] = None

c['workers'] = [
    worker.Worker('macos-local', 'macos-password'),
    worker.Worker('windows-qemu', 'windows-password'),
    worker.Worker('android-qemu', 'android-password'),
    worker.DockerLatentWorker(
        'linux-docker', 'linux-password',
        docker_host='unix:///var/run/docker.sock',
        image='sotf/buildbot-linux-worker:v4.1.0',
        # masterFQDN is required for the Docker latent worker to reach the PB
        # port on the host. 'host.docker.internal' works on Docker Desktop for
        # macOS; Linux Docker hosts may need the host's IP or a custom bridge.
        masterFQDN='host.docker.internal',
        max_builds=1,
        volumes=[
            f'{REPO_ROOT}:/workspace',
            'bb-linux-cargo-registry:/home/buildbot/.cargo/registry',
            'bb-linux-cargo-git:/home/buildbot/.cargo/git',
            'bb-linux-target:/workspace/target',
        ],
    ),
]

c['protocols'] = {'pb': {'port': 9989}}

# ---------------------------------------------------------------------------
# Change sources: poll each workspace git repo and the root aggregator repo.
# ---------------------------------------------------------------------------
c['change_source'] = []
for ws in WORKSPACES:
    c['change_source'].append(
        changes.GitPoller(
            repourl=f'file://{REPO_ROOT}/{ws["name"]}',
            branches=[ws['branch']],
            pollInterval=60,
            project=ws['name'],
        )
    )
c['change_source'].append(
    changes.GitPoller(
        repourl=f'file://{REPO_ROOT}',
        branches=['main'],
        pollInterval=60,
        project='root',
    )
)

# ---------------------------------------------------------------------------
# Factories
# ---------------------------------------------------------------------------
# NOTE: This CI tests the currently checked-out working tree on the host/VM.
# Factories do NOT perform a source checkout step; they run commands directly
# against the existing repository directory. This is intentional for this
# local CI instance where the master and workers share the same filesystem.
# ---------------------------------------------------------------------------
def _step_env(is_linux=False, ws_name=None):
    """Return the environment dict for a build step."""
    env = {'CARGO_TERM_COLOR': 'never'}
    if is_linux and ws_name:
        env['CARGO_TARGET_DIR'] = f'/workspace/target/{ws_name}'
    return env

def workspace_factory(ws_name, ws_dir, is_linux=False):
    """Return a factory that checks, lints and tests a Rust workspace."""
    base_dir = f'/workspace/{ws_name}' if is_linux else ws_dir
    env = _step_env(is_linux, ws_name)
    f = util.BuildFactory()
    f.addStep(steps.ShellCommand(
        name='check',
        command=['just', 'check'],
        workdir=base_dir,
        env=env,
        haltOnFailure=True,
    ))
    f.addStep(steps.ShellCommand(
        name='lint',
        command=['just', 'lint'],
        workdir=base_dir,
        env=env,
        haltOnFailure=True,
    ))
    f.addStep(steps.ShellCommand(
        name='test',
        command=['just', 'test'],
        workdir=base_dir,
        env=env,
        timeout=3600,
        haltOnFailure=True,
    ))
    return f

def qa_factory(ws_name, ws_dir, qa_target, is_linux=False):
    """Return a factory for a workspace's CI-friendly QA target."""
    base_dir = f'/workspace/{ws_name}' if is_linux else ws_dir
    env = _step_env(is_linux, ws_name)
    f = util.BuildFactory()
    f.addStep(steps.ShellCommand(
        name='qa',
        command=['just', qa_target],
        workdir=base_dir,
        env=env,
        timeout=7200,
        haltOnFailure=True,
    ))
    return f

def root_qa_factory():
    """Return a factory for root-level maintenance scripts.

    Root QA scripts write artifacts (e.g., quality-matrix/scores.json) back
    into the repo tree, which is why they run only on the macOS worker.
    """
    env = _step_env()
    f = util.BuildFactory()
    f.addStep(steps.ShellCommand(
        name='align-crates',
        command=['python3', 'scripts/align-crates/align_crate_versions.py'],
        workdir=REPO_ROOT,
        env=env,
        haltOnFailure=True,
    ))
    f.addStep(steps.ShellCommand(
        name='quality-matrix-collect',
        command=['python3', 'quality-matrix/collect.py'],
        workdir=REPO_ROOT,
        env=env,
        haltOnFailure=True,
    ))
    return f

# ---------------------------------------------------------------------------
# Builders
# ---------------------------------------------------------------------------
# CI-friendly QA targets per workspace
qa_map = {
    'autoeq': 'qa-roomeq-ci',
    'gpui-toolkit': 'qa-gpui-obvious',
    'math-audio': 'qa-math',
}

builder_names = []
c['builders'] = []

for ws in WORKSPACES:
    name = ws['name']
    ws_dir = f'{REPO_ROOT}/{name}'

    c['builders'].append(util.BuilderConfig(
        name=f'{name}-macos',
        workernames=['macos-local'],
        factory=workspace_factory(name, ws_dir, is_linux=False),
    ))
    c['builders'].append(util.BuilderConfig(
        name=f'{name}-linux',
        workernames=['linux-docker'],
        factory=workspace_factory(name, ws_dir, is_linux=True),
    ))

    # CI-friendly QA builders (where the workspace defines a CI QA target)
    if name in qa_map:
        c['builders'].append(util.BuilderConfig(
            name=f'{name}-qa-macos',
            workernames=['macos-local'],
            factory=qa_factory(name, ws_dir, qa_map[name], is_linux=False),
        ))
        c['builders'].append(util.BuilderConfig(
            name=f'{name}-qa-linux',
            workernames=['linux-docker'],
            factory=qa_factory(name, ws_dir, qa_map[name], is_linux=True),
        ))
        builder_names.extend([f'{name}-qa-macos', f'{name}-qa-linux'])

    builder_names.extend([f'{name}-macos', f'{name}-linux'])

# Windows QEMU builders (Apple-only crates excluded).
# The QEMU VM must make the repository available at the same absolute path
# used on the host (REPO_ROOT), or the workdir below must be adjusted for
# the VM environment. See docs/windows-worker-setup.md for details.
windows_feature_flags = {
    'sotf': '--features "qa,onnx,gpu-2d,gpu-3d,iamf,dev-api,streaming,hls"',
    'autoeq': '',
    'gpui-toolkit': '--features autoeq,camera,gpu-2d,gpu-3d,reqwest,spinorama,tokio,urlencoding',
    'math-audio': '--features plotly',
    'sofa-reader': '',
    'symphonia-add-ons': '',
}

for ws in WORKSPACES:
    name = ws['name']
    flags = windows_feature_flags.get(name, '')
    f = util.BuildFactory()
    f.addStep(steps.ShellCommand(
        name='check',
        command=['cargo', 'check', '--workspace', '--lib', '--bins', '--tests'] + (shlex.split(flags) if flags else []),
        workdir=f'{REPO_ROOT}/{name}',
        env={'CARGO_TERM_COLOR': 'never'},
        haltOnFailure=True,
    ))
    f.addStep(steps.ShellCommand(
        name='test',
        command=['cargo', 'test', '--workspace', '--lib', '--bins', '--tests', '--release'] + (shlex.split(flags) if flags else []),
        workdir=f'{REPO_ROOT}/{name}',
        env={'CARGO_TERM_COLOR': 'never'},
        timeout=3600,
        haltOnFailure=True,
    ))
    c['builders'].append(util.BuilderConfig(
        name=f'{name}-windows',
        workernames=['windows-qemu'],
        factory=f,
    ))
    builder_names.append(f'{name}-windows')

# Android QEMU builder for gpui-toolkit.
# The emulator/VM must make the repository available at the same absolute path
# used on the host (REPO_ROOT), or the workdir below must be adjusted for the
# VM environment. See docs/android-worker-setup.md for details.
android_factory = util.BuildFactory()
android_factory.addStep(steps.ShellCommand(
    name='android-check',
    command=['just', 'showcase-android-check'],
    workdir=f'{REPO_ROOT}/gpui-toolkit',
    env={
        'CARGO_TERM_COLOR': 'never',
        'ANDROID_HOME': '/opt/android-sdk',
        'ANDROID_SDK_ROOT': '/opt/android-sdk',
        'ANDROID_NDK_VERSION': '27.2.12479018',
    },
    timeout=1800,
    haltOnFailure=True,
))

c['builders'].append(util.BuilderConfig(
    name='gpui-toolkit-android-check',
    workernames=['android-qemu'],
    factory=android_factory,
))
builder_names.append('gpui-toolkit-android-check')

# Root-level maintenance script builders (run only on macOS because they write
# artifacts back into the repo tree and require Python script dependencies).
c['builders'].append(util.BuilderConfig(
    name='root-qa-macos',
    workernames=['macos-local'],
    factory=root_qa_factory(),
))
builder_names.append('root-qa-macos')

# ---------------------------------------------------------------------------
# Schedulers
# ---------------------------------------------------------------------------
c['schedulers'] = []
for ws in WORKSPACES:
    name = ws['name']
    builders_for_ws = [f'{name}-macos', f'{name}-linux']
    if name in qa_map:
        builders_for_ws.extend([f'{name}-qa-macos', f'{name}-qa-linux'])
    c['schedulers'].append(
        schedulers.SingleBranchScheduler(
            name=f'{name}-scheduler',
            change_filter=util.ChangeFilter(
                project=name, branch=ws['branch']
            ),
            treeStableTimer=60,
            builderNames=builders_for_ws,
        )
    )

c['schedulers'].append(
    schedulers.SingleBranchScheduler(
        name='root-scheduler',
        change_filter=util.ChangeFilter(project='root', branch='main'),
        treeStableTimer=60,
        builderNames=['root-qa-macos'],
    )
)

# Per-builder force schedulers so the web UI/API can target a single builder.
for builder_name in builder_names:
    c['schedulers'].append(
        schedulers.ForceScheduler(
            name=f'force-{builder_name}',
            builderNames=[builder_name],
        )
    )

# Per-workspace nightly schedulers use each workspace's branch and run
# every builder for that workspace (macOS, Linux, QA, Windows, and Android).
for ws in WORKSPACES:
    name = ws['name']
    nightly_builders_for_ws = [f'{name}-macos', f'{name}-linux', f'{name}-windows']
    if name in qa_map:
        nightly_builders_for_ws.extend([f'{name}-qa-macos', f'{name}-qa-linux'])
    if name == 'gpui-toolkit':
        nightly_builders_for_ws.append('gpui-toolkit-android-check')
    c['schedulers'].append(
        schedulers.Nightly(
            name=f'{name}-nightly',
            branch=ws['branch'],
            builderNames=nightly_builders_for_ws,
            hour=2,
            minute=0,
        )
    )

c['schedulers'].append(
    schedulers.Nightly(
        name='root-nightly',
        branch='main',
        builderNames=['root-qa-macos'],
        hour=2,
        minute=0,
    )
)

