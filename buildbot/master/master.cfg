from buildbot.plugins import *

REPO_ROOT = '/Volumes/home_ext1/src_pierre/all_of_sotf'

WORKSPACES = [
    {'name': 'sotf', 'branch': 'master'},
    {'name': 'autoeq', 'branch': 'main'},
    {'name': 'gpui-toolkit', 'branch': 'main'},
    {'name': 'math-audio', 'branch': 'main'},
    {'name': 'sofa-reader', 'branch': 'main'},
    {'name': 'symphonia-add-ons', 'branch': 'main'},
]

c = BuildmasterConfig = {}

c['title'] = 'SOTF CI'
c['titleURL'] = 'http://localhost:8010/'
c['buildbotURL'] = 'http://localhost:8010/'

c['workers'] = [
    worker.Worker('macos-local', 'macos-password'),
    worker.DockerLatentWorker(
        'linux-docker', 'linux-password',
        docker_host='unix:///var/run/docker.sock',
        image='sotf/buildbot-linux-worker:latest',
        masterFQDN='host.docker.internal',
        volumes=[
            f'{REPO_ROOT}:/workspace:ro',
            'bb-linux-cargo-registry:/root/.cargo/registry',
            'bb-linux-cargo-git:/root/.cargo/git',
            'bb-linux-target:/workspace/target',
        ],
    ),
]

c['protocols'] = {'pb': {'port': 9989}}

# ---------------------------------------------------------------------------
# Change sources: poll each workspace git repo and the root aggregator repo.
# ---------------------------------------------------------------------------
c['change_source'] = []
for ws in WORKSPACES:
    c['change_source'].append(
        changes.GitPoller(
            repourl=f'file://{REPO_ROOT}/{ws["name"]}',
            branches=[ws['branch']],
            pollInterval=60,
            project=ws['name'],
        )
    )
c['change_source'].append(
    changes.GitPoller(
        repourl=f'file://{REPO_ROOT}',
        branches=['main'],
        pollInterval=60,
        project='root',
    )
)

# ---------------------------------------------------------------------------
# Factories
# ---------------------------------------------------------------------------
def _step_env(is_linux=False):
    """Return the environment dict for a build step."""
    env = {'CARGO_TERM_COLOR': 'never'}
    if is_linux:
        env['CARGO_TARGET_DIR'] = '/workspace/target'
    return env

def workspace_factory(ws_name, ws_dir, is_linux=False):
    """Return a factory that checks, lints and tests a Rust workspace."""
    base_dir = f'/workspace/{ws_name}' if is_linux else ws_dir
    env = _step_env(is_linux)
    f = util.BuildFactory()
    f.addStep(steps.ShellCommand(
        name='check',
        command=['just', 'check'],
        workdir=base_dir,
        env=env,
        haltOnFailure=True,
    ))
    f.addStep(steps.ShellCommand(
        name='lint',
        command=['just', 'lint'],
        workdir=base_dir,
        env=env,
        haltOnFailure=True,
    ))
    f.addStep(steps.ShellCommand(
        name='test',
        command=['just', 'test'],
        workdir=base_dir,
        env=env,
        timeout=3600,
        haltOnFailure=True,
    ))
    return f

def qa_factory(ws_name, ws_dir, qa_target, is_linux=False):
    """Return a factory for a workspace's CI-friendly QA target."""
    base_dir = f'/workspace/{ws_name}' if is_linux else ws_dir
    env = _step_env(is_linux)
    f = util.BuildFactory()
    f.addStep(steps.ShellCommand(
        name='qa',
        command=['just', qa_target],
        workdir=base_dir,
        env=env,
        timeout=7200,
        haltOnFailure=True,
    ))
    return f

def root_qa_factory(is_linux=False):
    base_dir = '/workspace' if is_linux else REPO_ROOT
    f = util.BuildFactory()
    f.addStep(steps.ShellCommand(
        name='align-crates',
        command=['python3', 'scripts/align-crates/align_crate_versions.py'],
        workdir=base_dir,
        haltOnFailure=True,
    ))
    f.addStep(steps.ShellCommand(
        name='quality-matrix-collect',
        command=['python3', 'quality-matrix/collect.py'],
        workdir=base_dir,
        haltOnFailure=True,
    ))
    return f

# ---------------------------------------------------------------------------
# Builders
# ---------------------------------------------------------------------------
# CI-friendly QA targets per workspace
qa_map = {
    'autoeq': 'qa-roomeq-ci',
    'gpui-toolkit': 'qa-gpui-obvious',
    'math-audio': 'qa-math',
}

builder_names = []
c['builders'] = []

for ws in WORKSPACES:
    name = ws['name']
    ws_dir = f'{REPO_ROOT}/{name}'

    c['builders'].append(util.BuilderConfig(
        name=f'{name}-macos',
        workernames=['macos-local'],
        factory=workspace_factory(name, ws_dir, is_linux=False),
    ))
    c['builders'].append(util.BuilderConfig(
        name=f'{name}-linux',
        workernames=['linux-docker'],
        factory=workspace_factory(name, ws_dir, is_linux=True),
    ))

    # CI-friendly QA builders (where the workspace defines a CI QA target)
    if name in qa_map:
        c['builders'].append(util.BuilderConfig(
            name=f'{name}-qa-macos',
            workernames=['macos-local'],
            factory=qa_factory(name, ws_dir, qa_map[name], is_linux=False),
        ))
        c['builders'].append(util.BuilderConfig(
            name=f'{name}-qa-linux',
            workernames=['linux-docker'],
            factory=qa_factory(name, ws_dir, qa_map[name], is_linux=True),
        ))
        builder_names.extend([f'{name}-qa-macos', f'{name}-qa-linux'])

    builder_names.extend([f'{name}-macos', f'{name}-linux'])

# Root-level maintenance script builders
c['builders'].append(util.BuilderConfig(
    name='root-qa-macos',
    workernames=['macos-local'],
    factory=root_qa_factory(is_linux=False),
))
c['builders'].append(util.BuilderConfig(
    name='root-qa-linux',
    workernames=['linux-docker'],
    factory=root_qa_factory(is_linux=True),
))
builder_names.extend(['root-qa-macos', 'root-qa-linux'])

# ---------------------------------------------------------------------------
# Schedulers
# ---------------------------------------------------------------------------
c['schedulers'] = []
for ws in WORKSPACES:
    name = ws['name']
    builders_for_ws = [f'{name}-macos', f'{name}-linux']
    if name in qa_map:
        builders_for_ws.extend([f'{name}-qa-macos', f'{name}-qa-linux'])
    c['schedulers'].append(
        schedulers.SingleBranchScheduler(
            name=f'{name}-scheduler',
            change_filter=util.ChangeFilter(
                project=name, branch=ws['branch']
            ),
            treeStableTimer=60,
            builderNames=builders_for_ws,
        )
    )

c['schedulers'].append(
    schedulers.SingleBranchScheduler(
        name='root-scheduler',
        change_filter=util.ChangeFilter(project='root', branch='main'),
        treeStableTimer=60,
        builderNames=['root-qa-macos', 'root-qa-linux'],
    )
)

# Per-builder force schedulers so the web UI/API can target a single builder.
for builder_name in builder_names:
    c['schedulers'].append(
        schedulers.ForceScheduler(
            name=f'force-{builder_name}',
            builderNames=[builder_name],
        )
    )

c['schedulers'].append(
    schedulers.Nightly(
        name='nightly',
        branch='main',
        builderNames=builder_names,
        hour=2,
        minute=0,
    )
)

